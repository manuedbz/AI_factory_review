name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

# Le déploiement ne tourne jamais en parallèle pour un même environnement
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  id-token: write # jeton OIDC pour azure/login
  contents: read

jobs:
  # Mêmes contrôles que monitor-front (workflows partagés Urbasolar) avant de déployer
  lint:
    secrets: inherit
    uses: urbasolar/common-pipelines/.github/workflows/do-lint.yaml@main
    with:
      node-version: 22
      runs-on: ${{ vars.CI_RUNNER || 'urbasolar-azure-core-runner' }}

  test:
    secrets: inherit
    uses: urbasolar/common-pipelines/.github/workflows/do-test.yaml@main
    with:
      environment: dev
      node-version: 22
      runs-on: ${{ vars.CI_RUNNER || 'urbasolar-azure-core-runner' }}

  # main : semantic-release crée le tag vX.Y.Z (d'après les titres de commits feat/fix) ;
  # secrets VERSION_MANAGER_* d'organisation requis (hérités avec secrets: inherit)
  release:
    if: github.ref_name == 'main'
    needs: [lint, test]
    secrets: inherit
    uses: urbasolar/common-pipelines/.github/workflows/do-create-release-nodejs.yaml@main
    with:
      runs-on: ${{ vars.CI_RUNNER || 'urbasolar-azure-core-runner' }}

  deploy:
    needs: [lint, test, release]
    # develop -> dev ; main -> prod (désactivé tant que la variable de repo PROD_ENABLED n'est pas "true")
    # release est ignoré sur develop : !failure() évite que cela bloque le déploiement
    if: ${{ !cancelled() && !failure() && (github.ref_name == 'develop' || vars.PROD_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      # Variables de l'environnement GitHub "dev" (posées par l'usine)
      ACR_NAME: ${{ vars.ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP: ${{ vars.CONTAINER_APP_NAME }}
      # develop : SHA du commit ; main : version créée par semantic-release
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/${{ github.event.repository.name }}:${{ needs.release.outputs.released_version || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Connexion Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Connexion à l'ACR
        run: az acr login --name "$ACR_NAME"

      # Jetons npm lus dans le Key Vault de la factory (l'identité OIDC a le rôle Secrets User)
      - name: Préparer l'accès au registre npm privé
        env:
          FACTORY_KV: ${{ vars.FACTORY_KEY_VAULT }}
        run: |
          umask 077
          az keyvault secret show --vault-name "$FACTORY_KV" --name npm-npmrc --query value -o tsv > .npmrc

      - name: Build et push de l'image
        run: |
          docker build \
            --secret id=npmrc,src=.npmrc \
            --build-arg VITE_BUILD_NUMBER="${{ github.run_number }}" \
            --build-arg VITE_BUILD_COMMIT="${{ github.sha }}" \
            --build-arg VITE_BUILD_BRANCH="${{ github.ref_name }}" \
            --build-arg VITE_BUILD_ENV="${{ github.ref_name == 'main' && 'prod' || 'dev' }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Déploiement sur la Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"
