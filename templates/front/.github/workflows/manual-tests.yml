name: manual-tests
run-name: Manual - CI on ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      run-lint:
        type: boolean
        default: true
        description: lancer le lint
      run-test:
        type: boolean
        default: true
        description: lancer les tests

jobs:
  lint:
    if: ${{ inputs.run-lint }}
    secrets: inherit
    uses: urbasolar/common-pipelines/.github/workflows/do-lint.yaml@main
    with:
      node-version: 22
      runs-on: ${{ vars.CI_RUNNER || 'urbasolar-azure-core-runner' }}

  test:
    if: ${{ inputs.run-test }}
    secrets: inherit
    uses: urbasolar/common-pipelines/.github/workflows/do-test.yaml@main
    with:
      environment: dev
      node-version: 22
      runs-on: ${{ vars.CI_RUNNER || 'urbasolar-azure-core-runner' }}
