server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Les fichiers hachés par Vite peuvent être mis en cache longtemps
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Ne jamais mettre en cache le point d'entrée ni le service worker (PWA)
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Routage côté client (react-router)
  location / {
    try_files $uri /index.html;
  }
}
